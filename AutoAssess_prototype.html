<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AutoAssess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #EDEFF2;
    --surface: #FFFFFF;
    --surface-2: #F5F6F8;
    --line: #D7DBE0;
    --line-strong: #B5BCC6;
    --ink: #1B222B;
    --ink-2: #3B4450;
    --muted: #6B7480;
    --accent: #1F3A5F;
    --accent-ink: #FFFFFF;
    --accent-soft: #E8EEF5;
    --fast: #1F6B3A;   --fast-soft: #E3F0E7;
    --assist: #8A5A0C; --assist-soft: #FAF0DC;
    --esc: #A22B31;    --esc-soft: #F8E4E5;
    --retake: #4B5563; --retake-soft: #E8EBEF;
    --sev-minor: #C9A227; --sev-moderate: #D9742B; --sev-severe: #A22B31;
    --focus: #1F3A5F;
    --radius: 3px;
    --font-ui: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-ui); font-size: 13px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  a { color: var(--accent); }

  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 0 16px; min-height: 44px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand-name { font-weight: 600; font-size: 14px; letter-spacing: 0.01em; }
  .env { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line-strong); padding: 1px 6px; border-radius: 2px; }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 0; }
  .user { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
  .user select { padding: 3px 24px 3px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); font-size: 12.5px; }
  .topbar .btn { height: 28px; }

  main { flex: 1; padding: 16px; max-width: 1320px; width: 100%; margin: 0 auto; }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.005em; text-wrap: balance; }
  h2 { font-size: 11px; font-weight: 600; margin: 0; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
  p { margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
  .meta b { font-weight: 500; color: var(--muted); }

  .btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 0 10px; height: 30px; border-radius: var(--radius); cursor: pointer; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { border-color: var(--ink-2); background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.quiet { background: transparent; border-color: transparent; color: var(--ink-2); }
  .btn.quiet:hover { background: var(--surface-2); border-color: var(--line); }
  .btn.danger { color: var(--esc); border-color: var(--esc); }
  .btn.danger:hover { background: var(--esc-soft); }
  .btn.ok { color: var(--fast); border-color: var(--fast); }
  .btn.ok:hover { background: var(--fast-soft); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.sm { height: 24px; padding: 0 7px; font-size: 12px; }
  .link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: inherit; }

  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; height: 20px; border-radius: 2px; font-size: 11.5px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
  .chip.fast { background: var(--fast-soft); color: var(--fast); }
  .chip.assisted { background: var(--assist-soft); color: var(--assist); }
  .chip.escalate { background: var(--esc-soft); color: var(--esc); }
  .chip.retake { background: var(--retake-soft); color: var(--retake); }
  .chip.neutral { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); }
  .chip.outline { background: transparent; border-color: var(--line-strong); color: var(--ink-2); }
  .chip .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .sev { display: inline-block; width: 9px; height: 9px; border-radius: 1px; vertical-align: -1px; margin-right: 5px; }
  .sev.minor { background: var(--sev-minor); } .sev.moderate { background: var(--sev-moderate); } .sev.severe { background: var(--sev-severe); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .panel .hd { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; min-height: 36px; }
  .panel .bd { padding: 12px; }
  .notice { padding: 8px 12px; border-radius: var(--radius); font-size: 12.5px; border: 1px solid var(--line); background: var(--surface-2); }
  .notice.warn { border-color: #E2C98A; background: var(--assist-soft); }
  .notice.bad { border-color: #E4B3B6; background: var(--esc-soft); }
  .notice.good { border-color: #B9DBC4; background: var(--fast-soft); }
  .banner { font-size: 12.5px; padding: 7px 16px; border-bottom: 1px solid #E4B3B6; background: var(--esc-soft); color: var(--ink); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .banner b { color: var(--esc); }

  /* Queue */
  .toolbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .search { display: flex; align-items: center; gap: 6px; }
  .search input { height: 30px; width: 240px; max-width: 100%; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); font-size: 12.5px; }
  .tabs { display: flex; gap: 0; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 0; }
  .tabs button { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 7px 10px; cursor: pointer; font-size: 12.5px; color: var(--muted); margin-bottom: -1px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
  .tabs button .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
  .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); }
  .table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .table th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 500; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); text-transform: uppercase; letter-spacing: 0.05em; }
  .table td { padding: 0 10px; height: 36px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  .table td.wrap { white-space: normal; min-width: 220px; }
  .table tr.click { cursor: pointer; }
  .table tr.click:hover td { background: var(--surface-2); }
  .table td.r, .table th.r { text-align: right; }
  .table td.lane-cell { border-left: 3px solid var(--line-strong); }
  .table tr.l-fast td.lane-cell { border-left-color: var(--fast); } .table tr.l-assisted td.lane-cell { border-left-color: var(--assist); } .table tr.l-escalate td.lane-cell { border-left-color: var(--esc); } .table tr.l-retake td.lane-cell { border-left-color: var(--retake); }
  .reason { color: var(--muted); font-size: 12px; }
  .summary { font-size: 12.5px; color: var(--muted); }
  .summary b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

  /* Inline forms */
  .inline-form { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 520px; padding: 10px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--radius); }
  .inline-form textarea { min-height: 56px; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); font-size: 12.5px; resize: vertical; }

  /* Claim view */
  .claim-head { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .claim-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .claim-title h1 { font-family: var(--font-mono); font-weight: 500; font-size: 18px; }
  .route { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: start; padding: 10px 14px; border: 1px solid var(--line); border-left: 4px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); }
  .route.fast { border-left-color: var(--fast); } .route.assisted { border-left-color: var(--assist); } .route.escalate { border-left-color: var(--esc); } .route.retake { border-left-color: var(--retake); }
  .route .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding-top: 3px; }
  .route ul { margin: 0; padding-left: 16px; font-size: 12.5px; columns: 2; column-gap: 24px; }
  .route ul li { break-inside: avoid; padding: 1px 0; }
  @media (max-width: 860px) { .route ul { columns: 1; } .route { grid-template-columns: 1fr; } }
  .claim-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 12px; align-items: start; margin-top: 12px; }
  @media (max-width: 900px) { .claim-grid { grid-template-columns: minmax(0, 1fr); } .claim-grid > .stack:first-child { order: 2; } } @media (max-width: 640px) { .hide-sm { display: none; } .topbar { position: static; } } @media (max-width: 480px) { .hide-xs { display: none; } }
  .claim-grid > .stack { min-width: 0; }
  .photos { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
  .photo { position: relative; border: 1px solid var(--line); background: var(--surface-2); overflow: hidden; border-radius: 2px; max-width: 100%; min-width: 0; }
  .photo img { display: block; max-height: 420px; max-width: 100%; width: auto; height: auto; }
  .photo.wide img { max-height: 520px; }
  .photo .cap { position: absolute; left: 0; right: 0; top: 0; font-size: 10.5px; padding: 2px 6px; background: rgba(27,34,43,0.72); color: #fff; font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .photo .box { position: absolute; border: 2px solid rgba(255,255,255,0.95); outline: 1px solid rgba(27,34,43,0.6); outline-offset: 1px; border-radius: 1px; pointer-events: none; transition: opacity .12s; }
  .photo .box span { position: absolute; left: 0; top: 0; background: var(--ink); color: #fff; font-family: var(--font-mono); font-size: 10.5px; padding: 0 5px; line-height: 16px; border-radius: 0 0 2px 0; }
  .photo .box.sev-minor { border-color: var(--sev-minor); } .photo .box.sev-moderate { border-color: var(--sev-moderate); } .photo .box.sev-severe { border-color: var(--sev-severe); }
  .photo.dim .box { opacity: 0.35; } .photo.dim .box.on { opacity: 1; box-shadow: 0 0 0 3px rgba(255,255,255,0.55); }
  .photo.ph { min-height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 12px; padding: 12px; }
  .findings { list-style: none; margin: 0; padding: 0; }
  .findings li { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 8px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; cursor: default; }
  .findings li:last-child { border-bottom: 0; }
  .findings li:hover { background: var(--surface-2); }
  .findings .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .findings .t { font-weight: 500; }
  .findings .m { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
  .conf { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
  .conf.low { color: var(--assist); }
  .est { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .est th { text-align: left; font-size: 10.5px; color: var(--muted); font-weight: 500; padding: 5px 6px; border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  .est td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .est td.r, .est th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .est input, .est select { padding: 2px 5px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--surface); font-size: 12px; height: 24px; }
  .est input.n { width: 66px; text-align: right; font-family: var(--font-mono); }
  .est tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--line-strong); }
  .est tr.group td { background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 4px 6px; }
  .est .src { font-size: 11px; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 3px 10px; font-size: 12.5px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .hist { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  .hist li { padding: 5px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 118px 1fr; gap: 8px; }
  .hist li:last-child { border-bottom: 0; }
  .hist .ts { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  pre.json { font-family: var(--font-mono); font-size: 11px; background: var(--surface-2); padding: 10px; border-radius: var(--radius); overflow-x: auto; margin: 8px 0 0; max-height: 360px; }
  .message { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); max-width: 420px; }
  .message .from { padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .message .body { padding: 10px; white-space: pre-wrap; font-size: 12.5px; }
  .integrity { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
  .integrity span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--fast); margin-right: 5px; vertical-align: 0; }
  .integrity span.flag::before { background: var(--assist); }
  .integrity span.na::before { background: var(--line-strong); }

  /* Authorization document */
  .doc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 32px; max-width: 800px; margin: 0 auto; }
  .doc .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 14px; }
  .doc .head .t { font-size: 16px; font-weight: 600; }
  .doc .ref { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); text-align: right; }
  .doc .kv { grid-template-columns: 150px 1fr; margin: 12px 0; }
  .doc .sig { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 10px; font-size: 12px; color: var(--muted); }

  /* Drawer */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(27,34,43,0.10); z-index: 20; padding: 16px; overflow-y: auto; }
  .drawer h1 { font-size: 15px; }
  .drawer h3 { font-size: 12.5px; margin: 16px 0 4px; font-weight: 600; }
  .drawer p, .drawer li { font-size: 12.5px; }
  .drawer ul { padding-left: 18px; margin: 4px 0; }
  .ctl { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ctl label { font-size: 12.5px; }
  .ctl .hint { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); }
  .ctl input[type=range] { width: 150px; }
  .ctl .val { font-family: var(--font-mono); font-size: 12px; min-width: 56px; text-align: right; }
  .switch { position: relative; width: 36px; height: 20px; border-radius: 10px; background: var(--line-strong); border: 0; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--fast); } .switch.on::after { left: 18px; }
  .backdrop { position: fixed; inset: 0; background: rgba(27,34,43,0.30); z-index: 19; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: var(--radius); font-size: 12.5px; z-index: 30; max-width: 90vw; }
  .empty { padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-top: 0; }
  .credit { font-size: 11.5px; color: var(--muted); }
  @media print { .topbar, .banner, .actions, .btn, .drawer, .backdrop { display: none !important; } body { background: #fff; } main { padding: 0; } .doc { border: 0; } }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">AutoAssess</span>
      <span class="env">Prototype</span>
    </div>
    <div class="topbar-right">
      <label class="user">Signed in as
        <select id="roleSelect" aria-label="Role">
          <option value="agent">Dana Whitfield · Claims adjuster</option>
          <option value="senior">Marcus Okafor · Senior adjuster</option>
        </select>
      </label>
      <button type="button" class="btn quiet" id="btnLabels">Labels</button>
      <button type="button" class="btn quiet" id="btnSettings">Thresholds</button>
      <button type="button" class="btn quiet" id="btnAbout">About</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main id="main"><noscript><div class="notice warn" style="margin:24px auto;max-width:640px"><b>This prototype needs JavaScript.</b> Open the file in Chrome, Edge, Safari or Firefox on a computer (double-click it). Mail and file previews show only this frame.</div></noscript><div id="preload" class="notice" style="margin:24px auto;max-width:640px">Loading the claims queue… If this message stays, the file was opened in a preview that does not run scripts: open it in a desktop browser instead.</div></main>
  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="Panel"></aside>
  <div id="toast" class="toast" hidden></div>
</div>

<script>
(function () {
  'use strict';

  // ---------- Reference data (sample values; production reads the insurer's databases) ----------
  const PARTS = {
    front_bumper: { label: 'Front bumper cover', code: 'P-101', painted: true,  parts: 380, repair: [0.8, 1.5, 2.5], replace: 1.2, paint: 2.0 },
    rear_bumper:  { label: 'Rear bumper cover',  code: 'P-102', painted: true,  parts: 340, repair: [0.8, 1.5, 2.5], replace: 1.2, paint: 2.0 },
    hood:         { label: 'Hood',               code: 'P-103', painted: true,  parts: 520, repair: [1.0, 2.0, 3.5], replace: 1.0, paint: 2.5 },
    trunk:        { label: 'Trunk lid',          code: 'P-104', painted: true,  parts: 460, repair: [1.0, 2.0, 3.0], replace: 1.0, paint: 2.2 },
    roof:         { label: 'Roof panel',         code: 'P-105', painted: true,  parts: 900, repair: [1.5, 3.0, 5.0], replace: 6.0, paint: 3.0 },
    lf_fender:    { label: 'LF fender',          code: 'P-106', painted: true,  parts: 260, repair: [0.8, 1.5, 2.5], replace: 1.5, paint: 1.8 },
    rf_fender:    { label: 'RF fender',          code: 'P-107', painted: true,  parts: 260, repair: [0.8, 1.5, 2.5], replace: 1.5, paint: 1.8 },
    lf_door:      { label: 'LF door shell',      code: 'P-108', painted: true,  parts: 640, repair: [1.0, 2.0, 3.5], replace: 2.5, paint: 2.4 },

    if (a === 'return') { state.inlineForm = { claim: c.id, kind: 'return' }; return renderClaim(c.id); }
    if (a === 'return-confirm') { const n = ($('#noteReturn').value || '').trim(); if (!n) return; state.inlineForm = null; c.status = 'assessed'; c.seniorNote = n; captureLabel(c, 'senior.return', null, n, null); c.history.push({ ts, actor: who, action: 'Returned', detail: n }); save(); return renderClaim(c.id); }
    if (a === 'escalate') { c.status = 'escalated'; c.route = { lane: 'escalate', reasons: ['Escalated by the ' + ROLE_TITLE[who]].concat(c.route.reasons) }; captureLabel(c, 'route.override', 'assisted/fast', 'escalate', null); c.history.push({ ts, actor: who, action: 'Escalated', detail: 'Field appraisal; findings and photos attached' }); toast('Escalated. Findings attached for the appraiser.'); save(); return renderClaim(c.id); }
    if (a === 'retake' || a === 'photos') { c.status = 'retake_requested'; c.retakeMessage = retakeMessage(c); c.history.push({ ts, actor: who, action: 'Retake requested', detail: 'Specific retake request sent to the claimant' }); save(); return renderClaim(c.id); }
    if (a === 'override') { c.overridePhotos = true; c.status = 'assessed'; c.retakeMessage = null; captureLabel(c, 'photos.override', 'insufficient', 'proceed', null); routeClaim(c); c.history.push({ ts, actor: who, action: 'Override', detail: 'Proceeded with insufficient photos → ' + laneName(c.route.lane) }); save(); return renderClaim(c.id); }
    if (a === 'viewauth') return go('auth', c.id);
    if (a === 'auditok') { c.auditDone = true; c.auditResult = 'no discrepancy'; state.auditEvents.unshift({ ts, claim: c.id, result: 'ok' }); c.history.push({ ts, actor: who, action: 'Audit', detail: 'No discrepancy' }); save(); toast('Audit recorded.'); return renderClaim(c.id); }
    if (a === 'auditflag') { state.inlineForm = { claim: c.id, kind: 'auditflag' }; return renderClaim(c.id); }
    if (a === 'auditflag-confirm') { const n = ($('#noteFlag').value || '').trim(); if (!n) return; state.inlineForm = null; c.auditDone = true; c.auditResult = 'discrepancy'; state.auditEvents.unshift({ ts, claim: c.id, result: 'discrepancy', note: n }); captureLabel(c, 'audit.discrepancy', null, n, null); c.history.push({ ts, actor: who, action: 'Audit', detail: 'Discrepancy: ' + n }); const paused = pauseFastTrackIfNeeded(); if (paused) c.history.push({ ts: nowIso(), actor: 'system', action: 'Fast-track paused', detail: state.settings.ftPaused.reason }); save(); toast(paused ? 'Discrepancy logged. Fast-track paused automatically — open claims re-routed.' : 'Discrepancy logged — it counts against the rolling audit limit.'); renderBanner(); return renderClaim(c.id); }
  }

  // Authorization document
  function renderAuth(id) {
    const c = claimById(id); if (!c) return go('queue');
    const est = c.estimate, s = state.settings;
    const ref = 'AUTH-' + c.id.replace('C-', '') + '-' + String(hash(c.id + (c.authorizedAt || '')) % 9000 + 1000);
    const record = { reference: ref, claim: c.id, policy: c.policy, vin: c.vin, vehicle: c.vehicle, authorized_by: c.authorizedBy, authorized_at: c.authorizedAt, lane: c.route.lane, routing_reasons: c.route.reasons, thresholds_in_force: { fast_track_confidence: s.ftConfidence, fast_track_cap: s.ftCap, fast_track_enabled: s.ftEnabled }, assessment_source: c.assessment.source === 'model' ? MODEL_LABEL : c.assessment.source, price_table: PRICE_TABLE_VERSION, findings: c.assessment.findings, lines: est.lines.map((l) => ({ part: l.part, operation: l.operation, labor_hours: l.laborHours, parts: l.partsCost, refinish: l.refinishCost, total: l.total, edited: l.edited, source: l.source })), calibrations: est.cals.map((l) => ({ operation: l.cal, hours: l.laborHours, total: l.total, source: l.source })), total: est.total, human_actions: c.history.filter((h) => h.actor !== 'system'), audit_sample: !!c.audit };
    main.innerHTML = '<div class="toolbar" style="max-width:800px;margin:0 auto 12px"><h1>Repair authorization</h1><div class="row"><button type="button" class="btn" id="btnSend">Send to repair shop</button><button type="button" class="btn quiet" id="btnBack">Back to claim</button></div></div>'
      + '<div class="doc"><div class="head"><div><div class="t">Repair authorization</div><div class="small muted">Issued by AutoAssess on behalf of the insurer · to the approved repair shop</div></div><div class="ref">' + esc(ref) + '<br>' + esc(fmtTs(c.authorizedAt || nowIso())) + '</div></div>'
      + '<dl class="kv"><dt>Claim</dt><dd class="mono">' + esc(c.id) + '</dd><dt>Policyholder</dt><dd>' + esc(c.holder || '—') + '</dd><dt>Policy</dt><dd class="mono">' + esc(c.policy) + '</dd><dt>Vehicle</dt><dd>' + esc(vehicleStr(c.vehicle)) + ' · VIN <span class="mono">' + esc(c.vin || '—') + '</span></dd><dt>Authorized by</dt><dd>' + esc(c.authorizedBy === 'senior adjuster' ? PEOPLE.senior + ', senior adjuster' : PEOPLE.agent + ', claims adjuster (Fast-track)') + '</dd><dt>Lane</dt><dd>' + laneChip(c.route.lane) + '</dd><dt>Valid for</dt><dd>30 days · supplements require a new review</dd></dl>'
      + '<div class="table-wrap" style="border:0"><table class="est"><thead><tr><th>Line</th><th>Operation</th><th class="r">Labor h</th><th class="r">Parts</th><th class="r">Refinish</th><th class="r">Total</th></tr></thead><tbody>' + est.lines.map((l) => '<tr><td>' + esc(PARTS[l.part].label) + '</td><td>' + esc(l.operation) + '</td><td class="r mono">' + l.laborHours.toFixed(1) + '</td><td class="r mono">' + money(l.partsCost) + '</td><td class="r mono">' + money(l.refinishCost) + '</td><td class="r mono">' + money(l.total) + '</td></tr>').join('') + est.cals.map((l) => '<tr><td>' + esc(l.label) + '</td><td>calibrate</td><td class="r mono">' + l.laborHours.toFixed(1) + '</td><td class="r mono">—</td><td class="r mono">—</td><td class="r mono">' + money(l.total) + '</td></tr>').join('') + '</tbody><tfoot><tr><td colspan="5">Authorized amount</td><td class="r mono">' + money(est.total) + '</td></tr></tfoot></table></div>'
      + '<div class="sig">Prices from ' + esc(PRICE_TABLE_VERSION) + ' (sample). In production this document carries the insurer’s cost-database references and goes through the existing shop channel.</div>'
      + '<h2 style="margin-top:18px">Claimant notification</h2><div class="message" style="margin-top:6px;max-width:none"><div class="from"><span>To ' + esc(c.holder || 'claimant') + '</span><span>' + esc(fmtTs(c.authorizedAt || nowIso())) + '</span></div><div class="body">' + esc('Good news — the repair of your ' + (vehicleStr(c.vehicle) || 'vehicle') + ' has been authorized (claim ' + c.id + '). You can book with any approved repair shop; the shop receives the authorization directly. If the shop finds additional damage, they will contact us and we will review it.') + '</div></div>'
      + '<details style="margin-top:14px"><summary>Audit record — inputs, thresholds in force, model output, human actions</summary><pre class="json">' + esc(JSON.stringify(record, null, 2)) + '</pre></details>'
      + '</div>';
    $('#btnBack').addEventListener('click', () => go('claim', c.id));
    $('#btnSend').addEventListener('click', () => { toast('Sent to the repair shop (simulated). In production this is the shop integration.'); });
  }

  // Drawers: thresholds, labels, about
  function openDrawer(html) { const d = $('#drawer'); d.innerHTML = html; d.hidden = false; $('#backdrop').hidden = false; $('#backdrop').onclick = closeDrawer; }
  function closeDrawer() { $('#drawer').hidden = true; $('#backdrop').hidden = true; }
  function renderSettings() {
    const s = state.settings;
    openDrawer('<div class="row between"><h1>Thresholds</h1><button type="button" class="btn quiet" id="dClose">Close</button></div><p class="sub">The insurer’s levers. Changing one re-routes every open claim, so a new constraint can be shown live. In production the values come from shadow-mode data and are signed off by Claims leadership.</p>'
      + '<div class="ctl"><label for="cFt">Fast-track lane</label><button type="button" id="cFt" class="switch ' + (s.ftEnabled ? 'on' : '') + '" role="switch" aria-checked="' + s.ftEnabled + '" aria-label="Fast-track lane enabled"></button><span class="hint">' + (s.ftPaused ? '<b style="color:var(--esc)">Paused automatically</b> · ' + esc(s.ftPaused.reason) + ' · ' + esc(fmtTs(s.ftPaused.at)) + '. Re-enabling is a senior decision and is logged.' : 'Switch off if policy or a regulator forbids authorization without a person: everything falls back to Assisted.') + '</span></div>'
      + '<div class="ctl"><label for="cConf">Fast-track confidence threshold</label><span class="row"><input id="cConf" type="range" min="0.6" max="0.95" step="0.01" value="' + s.ftConfidence + '"><span class="val" id="vConf">' + pct(s.ftConfidence) + '</span></span><span class="hint">Lowest per-finding confidence a claim may have and still Fast-track. The claim’s confidence is its weakest finding, not the average.</span></div>'
      + '<div class="ctl"><label for="cCap">Fast-track value cap</label><span class="row"><input id="cCap" type="range" min="300" max="5000" step="50" value="' + s.ftCap + '"><span class="val" id="vCap">' + money(s.ftCap) + '</span></span><span class="hint">Estimates above this always get a person.</span></div>'
      + '<div class="ctl"><label for="cAudit">Senior audit sample of Fast-track authorizations</label><span class="row"><input id="cAudit" type="range" min="0" max="1" step="0.05" value="' + s.auditRate + '"><span class="val" id="vAudit">' + pct(s.auditRate) + '</span></span><span class="hint">The first two Fast-track authorizations are always sampled, then this share at random.</span></div>'
      + '<div class="ctl"><label for="cLimit">Automatic pause: discrepancies allowed per ' + s.auditWindowDays + ' days</label><span class="row"><input id="cLimit" type="range" min="1" max="5" step="1" value="' + s.auditFlagLimit + '"><span class="val" id="vLimit">' + s.auditFlagLimit + '</span></span><span class="hint">When senior audits log this many discrepancies inside the rolling window, the Fast-track lane pauses itself and open claims fall back to Assisted.</span></div>'
      + '<div class="ctl"><label for="cLabor">Labor rate (sample)</label><span class="row"><input id="cLabor" type="range" min="40" max="150" step="5" value="' + s.laborRate + '"><span class="val" id="vLabor">' + money(s.laborRate) + '/h</span></span><span class="hint">Production reads this from the insurer’s rate tables per shop network.</span></div>'
      + '<div class="row" style="margin-top:16px"><button type="button" class="btn" id="dReset">Reset sample data</button><span class="small muted" id="dResetNote">Restores the four sample claims and the default thresholds.</span></div>');
    $('#dClose').onclick = closeDrawer;
    const after = () => { rerouteOpen(); if (state.view !== 'new') render(); };
    const bind = (id, key, fmt, out) => { const el = $('#' + id); el.oninput = () => { s[key] = parseFloat(el.value); $('#' + out).textContent = fmt(s[key]); }; el.onchange = after; };
    bind('cConf', 'ftConfidence', pct, 'vConf'); bind('cCap', 'ftCap', money, 'vCap'); bind('cAudit', 'auditRate', pct, 'vAudit'); bind('cLabor', 'laborRate', (v) => money(v) + '/h', 'vLabor'); bind('cLimit', 'auditFlagLimit', (v) => String(v), 'vLimit');
    $('#cFt').onclick = () => { s.ftEnabled = !s.ftEnabled; if (s.ftEnabled && s.ftPaused) { s.ftPaused = null; state.labels.unshift({ ts: nowIso(), claim: '—', user: ROLE_TITLE[state.role], field: 'lane.reenabled', part: null, before: 'paused', after: 'enabled', source: 'policy' }); } else if (!s.ftEnabled) s.ftPaused = null; rerouteOpen(s.ftEnabled ? 'Fast-track re-enabled' : 'Fast-track switched off'); renderSettings(); if (state.view !== 'new') render(); };
    let armed = false;
    $('#dReset').onclick = () => { if (!armed) { armed = true; $('#dReset').textContent = 'Confirm reset'; $('#dReset').classList.add('danger'); $('#dResetNote').textContent = 'Claims you created in this session will be removed.'; return; } seed(); closeDrawer(); go('queue'); toast('Sample data reset.'); };
  }
  function renderLabels() {
    const L = state.labels;
    openDrawer('<div class="row between"><h1>Labels captured</h1><button type="button" class="btn quiet" id="dClose">Close</button></div><p class="sub">Every human correction is kept with the claim: which line, what changed, who changed it, and what the model had said. Together with the final repair cost these become the labelled outcomes that evaluation and the next model version are built on — offline, never in production.</p>'
      + (L.length ? '<ul class="hist">' + L.map((l) => '<li><span class="ts">' + esc(fmtTs(l.ts)) + '<br>' + esc(l.claim) + ' · ' + esc(l.user) + '</span><span><b>' + esc(l.field) + '</b>' + (l.part ? ' · ' + esc(l.part) : '') + '<br><span class="mono small">' + esc(l.before == null ? '—' : l.before) + ' → ' + esc(l.after == null ? '—' : l.after) + '</span> <span class="small muted">(' + esc(l.source) + ')</span></span></li>').join('') + '</ul>' : '<div class="empty" style="border:1px solid var(--line)">No labels yet. Edit a line in any claim, escalate one, or log an audit discrepancy and it appears here.</div>'));
    $('#dClose').onclick = closeDrawer;
  }
  function renderAbout() {
    openDrawer('<div class="row between"><h1>About this prototype</h1><button type="button" class="btn quiet" id="dClose">Close</button></div>'
      + '<p>AutoAssess is the claims-adjuster side of the product described in the PRD: photos come in, a vision model describes the damage, the insurer’s own data prices it, rules route the claim to Fast-track, Assisted or Escalate, and people decide what the rules leave to them. Version 0.2.</p>'
      + '<h3>What is real here</h3><ul><li>The routing rules, the thresholds and the automatic Fast-track pause run exactly as described in the PRD.</li><li>The pricing arithmetic: every line is looked up from a table and multiplied by rates; the model never sets a price.</li><li>Every human correction is captured as a label, with the value before and after.</li><li>The audit record on each authorization: inputs, thresholds in force, model output, human actions.</li></ul>'
      + '<h3>What is simulated</h3><ul><li>The sample claims’ findings and evidence boxes were written to match the photos, so the flow can be shown without a live model call. Where a vision model is connected to the page, “Re-run analysis” replaces them with the model’s own output; its boxes are approximate.</li><li>The cost table, labor rates, VIN records and the sensor-to-calibration map are small sample sets.</li><li>Integrity checks (metadata, reuse, consistency) are shown as they would appear but are not run.</li><li>Sending to the repair shop and messaging the claimant are stand-ins for the insurer’s integrations.</li><li>Data stays in this browser; nothing is sent anywhere unless you choose to re-run an analysis.</li></ul>'
      + '<h3>Photos</h3><p class="credit">Stock photographs used with thanks: ' + CREDITS.map((k) => esc(k.claim) + ' — ' + esc(k.by) + ' on ' + esc(k.site) + ' (' + esc(k.licence) + ')').join('; ') + '. Vehicles, names, policies and VINs are invented.</p>');
    $('#dClose').onclick = closeDrawer;
  }

  // ---------- Boot ----------
  $('#roleSelect').addEventListener('change', (e) => { state.role = e.target.value; state.tab = 'all'; state.inlineForm = null; go('queue'); });
  $('#btnSettings').addEventListener('click', renderSettings);
  $('#btnLabels').addEventListener('click', renderLabels);
  $('#btnAbout').addEventListener('click', renderAbout);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
  if (!load()) seed(); else state.claims.forEach((c) => { c.estimate = c.estimate || null; computeEstimate(c); if (!c.route) routeClaim(c); });
  render();
  detectAI();
})();
</script>

</body>
</html>
